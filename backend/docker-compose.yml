# Composeのプロジェクト名は既定でこのファイルがあるディレクトリ名（backend）になる。
# それだとDocker Desktop上でどのプロジェクトのスタックか判別できず、
# 他プロジェクトも backend/ にcomposeを置いていると衝突するため、明示する。
name: raisetimeline

services:
  db:
    image: postgres:17
    container_name: raisetimeline-db
    environment:
      POSTGRES_DB: raisetimeline
      POSTGRES_USER: raisetimeline
      POSTGRES_PASSWORD: raisetimeline
    ports:
      - "5432:5432"
    volumes:
      - raisetimeline-db-data:/var/lib/postgresql/data

  # ローカル開発・テスト用のS3互換ストレージ。
  # 本番のAWS S3と同じコードパスを、課金なし・AWS接続なしで検証するために使う。
  #
  # バケットは起動時にデータディレクトリ配下のフォルダとして作成する。
  # MinIOは /data 直下のディレクトリをバケットとして扱うため、
  # 別途 minio/mc の初期化コンテナを立てる必要がない。
  # presigned URL方式のため、匿名読み取りの許可は設定しない。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: raisetimeline-minio
    # 既定のentrypointは引数を minio サブコマンドとして解釈するため、entrypointごと差し替える
    entrypoint: >
      sh -c "mkdir -p /data/raisetimeline-post-images &&
             exec minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: raisetimeline
      MINIO_ROOT_PASSWORD: raisetimeline
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 管理コンソール
    volumes:
      - raisetimeline-minio-data:/data

volumes:
  raisetimeline-db-data:
  raisetimeline-minio-data:
