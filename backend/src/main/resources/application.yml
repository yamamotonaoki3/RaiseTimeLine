server:
  port: 8080

spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5432/raisetimeline
    username: raisetimeline
    password: raisetimeline
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  web:
    resources:
      static-locations: classpath:/static/

app:
  cors:
    # CORS で許可するオリジン。カンマ区切り。本番は CORS_ALLOWED_ORIGINS で上書きする。
    #   5173 … 開発サーバ（vite dev / E2Eテスト）
    #   4183 … 本番ビルド成果物の配信（vite preview / ブラウザパフォーマンステスト）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4183}
  # アバターのローカル保存は廃止した（S3に統一）。
  # この設定は AvatarMigrationRunner が移行元のファイルを読むためだけに残している。
  # 移行完了後に、Runner ごと削除する。
  upload:
    dir: uploads/avatars
  migration:
    # true にすると起動時に一度だけ、ローカルのアバターをS3へ移行する。
    # 移行済みの行は対象外になるため、繰り返し起動しても二重処理されない。
    avatar-to-s3: ${AVATAR_MIGRATION_ENABLED:false}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:raisetimeline-post-images}
    region: ${AWS_S3_REGION:ap-northeast-1}
    # 既定はローカルのMinIOを向く。本番は AWS_S3_ENDPOINT を空にすることで実AWSのS3を向く。
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    # MinIOはパス形式（http://host:9000/bucket/key）を前提とする。
    # falseのままだとバケット名がホスト名に混入し、接続できない。
    path-style-access: ${AWS_S3_PATH_STYLE:true}
    # 設定されていれば静的な認証情報を使う（MinIO用）。空なら環境変数から読む（実S3用）。
    access-key: ${AWS_S3_ACCESS_KEY:raisetimeline}
    secret-key: ${AWS_S3_SECRET_KEY:raisetimeline}
    # 画像表示用のpresigned URLの有効期限（分）
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_EXPIRATION_MINUTES:60}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml

jwt:
  secret: raisetimeline-secret-key-must-be-at-least-32-characters-long
  access-expiration: 900000
  refresh-expiration: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  default-produces-media-type: application/json
