# 全環境で共通の設定だけを置く。
#
# 環境によって変わる値（接続先・認証情報・許可オリジン等）は、ここには書かない。
# 書いてしまうと「本番で上書きし忘れた項目が、黙ってローカル向けの値で動く」ことになるため。
# 環境依存の値はプロファイルごとのファイルに置く。
#
#   application-local.yml … ローカル開発・E2E・性能計測（既定）
#   application-prod.yml  … 本番。すべて環境変数から与える
#   application-test.yml  … 自動テスト（src/test/resources、@ActiveProfiles("test") で有効化）
#
# 切り替えは SPRING_PROFILES_ACTIVE で行う。未指定なら local。
spring:
  application:
    name: api
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  web:
    resources:
      static-locations: classpath:/static/

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml

jwt:
  # 署名鍵（jwt.secret）は環境依存の秘密情報のため、各プロファイル側で定義する。
  access-expiration: 900000
  refresh-expiration: 604800000
  # 使用済みリフレッシュトークンの再提示を「正常な同時アクセス」として許容する猶予（秒）。
  # 複数タブを同時に開くと、どのタブも同じトークンを送るため、この猶予がないと
  # 後から届いたリクエストが弾かれてログアウトされる。
  # 猶予内は新規発行せず、既に発行済みの同じトークンを返す。
  # 猶予を過ぎた再提示は盗用の疑いとして全セッションを失効させる。
  refresh-rotation-grace-seconds: 30

springdoc:
  # 公開するか否か（swagger-ui.enabled / api-docs.enabled）はプロファイルごとに決める。
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  default-produces-media-type: application/json
