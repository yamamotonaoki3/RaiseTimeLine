# 自動テスト用のプロファイル（@ActiveProfiles("test") で有効化）。
#
# application.yml には全環境共通の設定しか置かないため、環境依存の項目は
# すべてここで与える必要がある。値はテスト専用の明らかなダミーでよい
# （テストは実際のDB・S3へ接続せず、H2とモックで完結するため）。
spring:
  datasource:
    url: >-
      jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml

app:
  cors:
    allowed-origins: http://localhost:5173
  s3:
    bucket-name: test-bucket
    region: ap-northeast-1
    access-key: test-access-key
    secret-key: test-secret-key

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long
  access-expiration: 900000
  refresh-expiration: 604800000
