spring:
  datasource:
    url: >-
      jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
app:
  # application.yml から既定値を外した（実値をリポジトリに置かないため）ので、
  # テストでは明らかにダミーと分かる固定値をここで与える。
  # テストはS3へ実際に接続しないため、値の中身は問われない。
  s3:
    access-key: test-access-key
    secret-key: test-secret-key

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long
  access-expiration: 900000
  refresh-expiration: 604800000
aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-1
