name: Deploy Backend to ECR

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: raisetimeline-backend
        run: |
          set -euo pipefail
          IMAGE_TAG=$(git rev-parse --short=7 HEAD)

          set +e
          DESCRIBE_OUTPUT=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" 2>&1)
          DESCRIBE_STATUS=$?
          set -e

          if [ "$DESCRIBE_STATUS" -eq 0 ]; then
            {
              echo "### ECRへのpushをスキップしました"
              echo ""
              echo "タグ \`$IMAGE_TAG\` のイメージは既にECRに存在します。"
              echo "同じコミットの再実行のため、ビルドとpushは行いませんでした。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! grep -q 'ImageNotFoundException' <<< "$DESCRIBE_OUTPUT"; then
            echo "$DESCRIBE_OUTPUT" >&2
            exit "$DESCRIBE_STATUS"
          fi

          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" backend
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          {
            echo "### ECRへpushしました"
            echo ""
            echo "\`\`\`"
            echo "backend_image_tag = \"$IMAGE_TAG\""
            echo "\`\`\`"
            echo ""
            echo "この値を \`infra/terraform/terraform.tfvars\` の \`backend_image_tag\` に設定し、\`terraform apply\` してください。"
          } >> "$GITHUB_STEP_SUMMARY"
